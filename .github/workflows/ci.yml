name: CI Pipeline

on:
    # CSAK AKKOR INDUL EL, HA PR-T NYITNAK VAGY FRISSÍTENEK A MAIN ÁGRA
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

jobs:
    # --- FRONTEND JOB ---
    frontend-ci:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./fontend
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint & Prettier Check
              run: npm run lint

            # --- AZ ÚJ BUILD LÉPÉS, AMIT KÉRTÉL ---
            - name: Build frontend
              run: npm run build

    # --- BACKEND JOB ---
    backend-ci:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: "gradle"

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Build and Run Tests with Checkstyle
              run: ./gradlew build
