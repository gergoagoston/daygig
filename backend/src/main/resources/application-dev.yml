spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/daygig
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
  sql:
    init:
      mode: never
  rabbitmq:
    host: localhost
    port: 5672
    username: daygig
    password: daygig
    virtual-host: /daygig

logging:
  level:
    root: INFO
    "[edu.bbte.daygig.backend]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE
