services:
  daygig-db:
    image: postgis/postgis:17-3.5
    container_name: daygig-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: daygig
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - daygig-data:/var/lib/postgresql/data

  daygig-rabbitmq:
    image: rabbitmq:4-management
    container_name: daygig-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: daygig
      RABBITMQ_DEFAULT_PASS: daygig
      RABBITMQ_DEFAULT_VHOST: /daygig
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - daygig-rabbitmq-data:/var/lib/rabbitmq

volumes:
  daygig-data:
  daygig-rabbitmq-data:
