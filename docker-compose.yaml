services:
  daygig-db:
    image: postgres:17
    container_name: daygig-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: daygig
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - daygig-data:/var/lib/postgresql/data

volumes:
  daygig-data:
